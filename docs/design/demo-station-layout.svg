<text x="277" y="1151" class="tiny">Example gap</text>
<text x="119" y="1149" class="tiny">35 mm pole + thin pad</text>
<text x="354" y="1149" class="tiny">Box tab / ABS back</text>
<text x="510" y="994" class="label">Connection order</text>
<text x="510" y="1023" class="small">Pole + thin rubber → plywood → U-bolt plate / washers / nuts.</text>
<text x="510" y="1050" class="small">Local fasteners hold the box tabs clear of the U-bolt hardware.</text>
<text x="510" y="1077" class="small">The trimmed U-bolt ends must stay clear of the box.</text>
<text x="510" y="1104" class="small">Mark holes from actual parts; this inset is not to scale.</text>
<text x="510" y="1134" class="tiny">Dry-fit, trim away from electronics, deburr, then reassemble.</text>
