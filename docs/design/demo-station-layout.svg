<!-- legend -->
<text x="837" y="145" class="label">Parts and connections</text>
<text x="837" y="185" class="label">1  Stand — P1</text>
<text x="837" y="210" class="small">Complete STAND-V011, nominal 35 mm pole.</text>
<text x="837" y="232" class="small">Includes table clamp, arm and VESA plate.</text>
<text x="837" y="276" class="label">2  Camera — P2</text>
<text x="837" y="301" class="small">Clamp slides vertically; ball head sets angle.</text>
<text x="837" y="323" class="small">Keep the arm short and cable slack.</text>
<text x="837" y="367" class="label">3  Touchscreen — P5 + local adapter</text>
<text x="837" y="392" class="small">Custom board joins screen tabs to VESA.</text>
<text x="837" y="414" class="small">Use the included VIVO arm; no extra arm.</text>
<text x="837" y="458" class="label">4  Stack light — local fabrication</text>
<text x="837" y="483" class="small">Use a locally made bracket or platform.</text>
<text x="837" y="505" class="small">P3 has two spare U-bolts for this mount.</text>
<text x="837" y="549" class="label">5  Box — P3 + local backing / spacers</text>
<text x="837" y="574" class="small">Two U-bolts; provide local clearance spacers.</text>
<text x="837" y="596" class="small">Use existing tabs, clear the lid and ports.</text>
<text x="837" y="640" class="label">6  Keyence — housing still to confirm</text>
<text x="837" y="665" class="small">Confirm the existing protected installation.</text>
<text x="837" y="687" class="small">Keep its weight supported on the table.</text>
<path d="M836 720H1210" stroke="#d5e1eb"/>
<text x="837" y="754" class="label">Lighting and cooling</text>
<text x="837" y="779" class="small">Use available lighting and the Pi cooler.</text>
<text x="837" y="801" class="small">Check glare and temperature after assembly.</text>
<text x="837" y="830" class="tiny">Component IDs match demo-station-parts.md.</text>
<!-- enclosure clearance inset -->
<rect x="40" y="889" width="1200" height="279" rx="16" fill="white" stroke="#d6e1eb"/>
