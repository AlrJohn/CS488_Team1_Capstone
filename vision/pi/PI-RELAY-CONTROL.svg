<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1120" viewBox="0 0 1420 1120">
  <style>
    text {font-family:Arial,sans-serif;fill:#151515;font-size:22px}
    .title {font-size:32px;font-weight:bold}
    .heading {font-size:25px;font-weight:bold}
    .small {font-size:19px}
    .pin {fill:#eee;stroke:#777;stroke-width:2}
    .used {fill:#fff;stroke:#111;stroke-width:3}
    .panel {fill:#fff;stroke:#444;stroke-width:2}
    .wire {fill:none;stroke:#222;stroke-width:3}
  </style>
  <rect width="1420" height="1120" fill="white"/>
  <text x="35" y="45" class="title">Pi 5 to relay: small control pins, not the screw terminals</text>
  <text x="35" y="80">Power OFF before wiring. Remove the blue VCC–JD-VCC cap and leave it removed.</text>
  <text x="35" y="112" class="small">This 3.3 V input arrangement requires the relay-only check in STACK-LIGHT-WIRING.md before GPIO connection.</text>

  <rect x="35" y="140" width="495" height="815" rx="10" class="panel"/>
  <text x="55" y="176" class="heading">Pi 40-pin header: physical numbers</text>
  <text x="55" y="208" class="small">Find the board's PIN 1 mark first.</text>
  <text x="55" y="236" class="small">Rotate this map to match that mark.</text>
  <text x="158" y="270" class="small">ODD</text>
  <text x="290" y="270" class="small">EVEN</text>
  <g class="small" text-anchor="middle">
    <circle cx="195" cy="300" r="13" class="used"/><text x="160" y="307">1</text>
    <circle cx="285" cy="300" r="13" class="used"/><text x="320" y="307">2</text>
    <circle cx="195" cy="332" r="10" class="pin"/><text x="160" y="339">3</text>
    <circle cx="285" cy="332" r="10" class="pin"/><text x="320" y="339">4</text>
    <circle cx="195" cy="364" r="10" class="pin"/><text x="160" y="371">5</text>
    <circle cx="285" cy="364" r="13" class="used"/><text x="320" y="371">6</text>
    <circle cx="195" cy="396" r="10" class="pin"/><text x="160" y="403">7</text>
    <circle cx="285" cy="396" r="10" class="pin"/><text x="320" y="403">8</text>
    <circle cx="195" cy="428" r="10" class="pin"/><text x="160" y="435">9</text>
    <circle cx="285" cy="428" r="10" class="pin"/><text x="320" y="435">10</text>
    <circle cx="195" cy="460" r="13" class="used"/><text x="160" y="467">11</text>
    <circle cx="285" cy="460" r="10" class="pin"/><text x="320" y="467">12</text>
    <circle cx="195" cy="492" r="13" class="used"/><text x="160" y="499">13</text>
    <circle cx="285" cy="492" r="10" class="pin"/><text x="320" y="499">14</text>
    <circle cx="195" cy="524" r="13" class="used"/><text x="160" y="531">15</text>
    <circle cx="285" cy="524" r="10" class="pin"/><text x="320" y="531">16</text>
    <circle cx="195" cy="556" r="10" class="pin"/><text x="160" y="563">17</text>
    <circle cx="285" cy="556" r="10" class="pin"/><text x="320" y="563">18</text>
    <circle cx="195" cy="588" r="10" class="pin"/><text x="160" y="595">19</text>
    <circle cx="285" cy="588" r="10" class="pin"/><text x="320" y="595">20</text>
    <circle cx="195" cy="620" r="10" class="pin"/><text x="160" y="627">21</text>
    <circle cx="285" cy="620" r="10" class="pin"/><text x="320" y="627">22</text>
    <circle cx="195" cy="652" r="10" class="pin"/><text x="160" y="659">23</text>
    <circle cx="285" cy="652" r="10" class="pin"/><text x="320" y="659">24</text>
    <circle cx="195" cy="684" r="10" class="pin"/><text x="160" y="691">25</text>
    <circle cx="285" cy="684" r="10" class="pin"/><text x="320" y="691">26</text>
    <circle cx="195" cy="716" r="10" class="pin"/><text x="160" y="723">27</text>
    <circle cx="285" cy="716" r="10" class="pin"/><text x="320" y="723">28</text>
    <circle cx="195" cy="748" r="10" class="pin"/><text x="160" y="755">29</text>
    <circle cx="285" cy="748" r="10" class="pin"/><text x="320" y="755">30</text>
    <circle cx="195" cy="780" r="10" class="pin"/><text x="160" y="787">31</text>
    <circle cx="285" cy="780" r="10" class="pin"/><text x="320" y="787">32</text>
    <circle cx="195" cy="812" r="10" class="pin"/><text x="160" y="819">33</text>
    <circle cx="285" cy="812" r="10" class="pin"/><text x="320" y="819">34</text>
    <circle cx="195" cy="844" r="10" class="pin"/><text x="160" y="851">35</text>
    <circle cx="285" cy="844" r="10" class="pin"/><text x="320" y="851">36</text>
    <circle cx="195" cy="876" r="10" class="pin"/><text x="160" y="883">37</text>
    <circle cx="285" cy="876" r="10" class="pin"/><text x="320" y="883">38</text>
    <circle cx="195" cy="908" r="10" class="pin"/><text x="160" y="915">39</text>
    <circle cx="285" cy="908" r="10" class="pin"/><text x="320" y="915">40</text>
  </g>
  <text x="65" y="307" class="small">3.3 V →</text>
  <text x="355" y="307" class="small">← 5 V</text>
  <text x="355" y="371" class="small">← GND</text>
  <text x="62" y="467" class="small">GP17 →</text>
  <text x="62" y="499" class="small">GP27 →</text>
  <text x="62" y="531" class="small">GP22 →</text>

  <rect x="560" y="140" width="825" height="455" rx="10" class="panel"/>
  <text x="580" y="178" class="heading">Relay board as in your last photo</text>
  <text x="580" y="210" class="small">K1 at top, K4 at bottom, screw terminals along the RIGHT edge.</text>
  <text x="580" y="242" class="small">The six small input-header pins run TOP to BOTTOM:</text>
  <g>
    <rect x="590" y="267" width="160" height="260" rx="5" fill="#f3f3f3" stroke="#333"/>
    <circle cx="615" cy="290" r="6"/><text x="635" y="298">GND</text>
    <circle cx="615" cy="331" r="6"/><text x="635" y="339">IN1</text>
    <circle cx="615" cy="372" r="6"/><text x="635" y="380">IN2</text>
    <circle cx="615" cy="413" r="6"/><text x="635" y="421">IN3</text>
    <circle cx="615" cy="454" r="6"/><text x="635" y="462">IN4</text>
    <circle cx="615" cy="495" r="6"/><text x="635" y="503">VCC</text>
    <path d="M750 290 H805 M750 331 H805 M750 372 H805 M750 413 H805 M750 454 H805 M750 495 H805" class="wire"/>
    <text x="820" y="298">Pi physical pin 6 — ground</text>
    <text x="820" y="339">Pi physical pin 11 / GPIO17 — RED</text>
    <text x="820" y="380">Pi physical pin 13 / GPIO27 — YELLOW</text>
    <text x="820" y="421">Pi physical pin 15 / GPIO22 — GREEN</text>
    <text x="820" y="462">Tie to 3.3 V VCC — channel 4 unused</text>
    <text x="820" y="503">Pi physical pin 1 — 3.3 V</text>
  </g>
  <text x="580" y="560">Separate header: JD-VCC ← Pi physical pin 2 (5 V).</text>
  <text x="580" y="584" class="small">Identify JD-VCC from its printed label after removing the blue cap.</text>

  <rect x="560" y="615" width="825" height="340" rx="10" class="panel"/>
  <text x="580" y="653" class="heading">Add three 10 kΩ resistors to hold inputs OFF</text>
  <text x="580" y="686" class="small">One resistor per input. Each GPIO wire still connects straight to IN.</text>
  <text x="585" y="744">3.3 V VCC</text>
  <path d="M730 737 H775 M865 737 H950 V810 H1030" class="wire"/>
  <rect x="775" y="724" width="90" height="26" fill="white" stroke="#222" stroke-width="2"/>
  <text x="789" y="713" class="small">10 kΩ</text>
  <circle cx="950" cy="810" r="5"/>
  <path d="M730 810 H950" class="wire"/>
  <text x="585" y="817">Pi GPIO17</text>
  <text x="1045" y="817">Relay IN1</text>
  <text x="580" y="870" class="small">Repeat: 3.3 V — 10 kΩ — IN2; GPIO27 also joins IN2.</text>
  <text x="580" y="900" class="small">Repeat: 3.3 V — 10 kΩ — IN3; GPIO22 also joins IN3.</text>
  <text x="580" y="932" class="small">Use a breadboard/distribution point to share the 3.3 V connection.</text>

  <text x="35" y="993">Before GPIO signal wires: check all IN pins ≤3.3 V and firm switching when IN is temporarily grounded.</text>
  <text x="35" y="1025">If the relay will not switch reliably, use a 3.3 V compatible interface; do not change input VCC to 5 V.</text>
  <text x="35" y="1057">Keep 24 V away from ALL small headers and the Pi. Purple buzzer stays disconnected and insulated.</text>
  <text x="35" y="1090">Test after checks: python vision/pi/check_lights.py --cycle --gpio-active-low</text>
</svg>
